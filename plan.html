const ICON = {done:"완료", run:"진행 중", wait:"대기"};
document.getElementById("goal").innerHTML = GOAL;
// render the §4W.1 refinement-loop log (running verification hook)
(function(){
  var vcls = function(v){ return v.indexOf("MET")>=0?"met":(v.indexOf("FAIL")>=0?"fail":"part"); };
  var head = "<tr><th>#</th><th>시각</th>" + CRIT.map(function(c){return "<th>"+c+"</th>";}).join("") + "<th>다음 우선/액션</th></tr>";
  var rows = LOOPLOG.map(function(r){
    return "<tr><td>"+r.iter+"</td><td class='lts'>"+r.ts+"</td>"
      + r.scores.map(function(v){return "<td class='v "+vcls(v)+"'>"+v+"</td>";}).join("")
      + "<td class='act'><b>"+r.priority+"</b> · "+r.action+"</td></tr>";
  }).join("");
  document.getElementById("looplog").innerHTML =
    "<div class='loopwrap'><h3>§4W.1 정련 루프 로그 <span class='hook'>● 상시 가동(hook)</span></h3>"
    + "<div class='loopsub'>논문 Stage 2.3의 반복 루프. 매 웨이브 codex가 6개 수용 기준을 채점 → 최저 항목이 다음 액션 → 다음 반복에서 검증. 멈추지 않는다.</div>"
    + "<div class='ttl'><table>"+head+rows+"</table></div></div>";
})();
document.getElementById("foot").innerHTML = FOOT + "<div class='stamp' style='margin-top:10px'>갱신: " + UPDATED + "</div>";
const wrap = document.getElementById("wrap");
let lastStage = "";
for (const s of STEPS) {
  if (s.stage !== lastStage) {
    const h = document.createElement("div"); h.className = "stage"; h.textContent = s.stage; wrap.appendChild(h); lastStage = s.stage;
  }
  const d = document.createElement("details"); d.className = "step st-" + s.status;
  if (s.status === "run") d.open = true;
  // revision = execution log: when a plan was superseded, its old line is struck WITH the timestamp
  // it was cancelled, and the new plan carries the timestamp it was executed.
  let revHtml = "";
  if (s.rev && s.rev.length) {
    revHtml = "<div class='rev'><h4>실행 로그 · 개정 이력</h4>" + s.rev.map(function(r){
      var oldTs = r.tsOld || r.when || "";
      var newTs = r.tsNew || r.when || "";
      return "<div class='logline'>"
        + "<span class='ts'>" + oldTs + "</span> <span class='old'>" + r.old + "</span>"
        + "<br><span class='ts new'>" + newTs + "</span> <span class='new'>→ " + r.new + "</span></div>";
    }).join("") + "</div>";
  }
  var stamp = s.ts ? "<span class='ststamp'>" + s.ts + "</span>" : "";
  d.innerHTML = "<summary><span class='dot'></span><span class='tt'>" + s.title +
    "</span>" + stamp + "<span class='badge'>" + ICON[s.status] + "</span></summary><div class='body'>" + s.body + revHtml + "</div>";
  wrap.appendChild(d);
}
